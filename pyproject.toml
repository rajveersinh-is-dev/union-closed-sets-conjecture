[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "union_closed_sets_conjecture"
version = "1.0.0"
description = "Research on Frankl's Union-Closed Sets Conjecture: definitions, known results, proof attempts, and computational verification."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "rajveersinh-is-dev"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/rajveersinh-is-dev/union-closed-sets-conjecture"

[tool.setuptools]
py-modules = ['']
